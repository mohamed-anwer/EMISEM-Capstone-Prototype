/* Admissions extension v3 — accessible in both Alexandria University themes. */
.modal:has(.application-form){width:min(950px,96vw)}
.modal:has(.application-form) .modal-content{padding:20px 24px}
.form-section{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:13px 0 1px;padding:11px 0 9px;border-bottom:1px solid var(--line);color:var(--text)}
.form-section:first-child{margin-top:0}
.form-section>span{width:30px;height:30px;display:grid;place-items:center;background:var(--status-bg);color:var(--blue);border:1px solid var(--line2);border-radius:8px;font-family:Arial;font-size:11px;font-weight:800}

.required-chip,.optional-chip{display:inline-block;font-size:9px;font-weight:700;margin-right:6px;padding:2px 6px;border-radius:5px;background:var(--status-bg);border:1px solid var(--line);color:var(--blue)}
.optional-chip{color:var(--muted)}

.application-form input[type=file]::file-selector-button,.modal input[type=file]::file-selector-button{background:var(--status-bg);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;margin-left:10px;color:var(--blue);cursor:pointer;font-weight:700}
.form-actions{display:flex;justify-content:flex-start;align-items:center;margin-top:9px}
.doc-privacy{display:flex;gap:10px;align-items:center;padding:11px 13px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:10px;font-size:11px}

.attachment-grid{display:grid;gap:8px;margin:12px 0}
.attachment-item{display:flex;align-items:center;gap:12px;padding:12px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);min-width:0;flex-wrap:wrap}
.attachment-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:var(--status-bg);color:var(--blue);flex:none}

const volatileFiles=new Map(); let attachmentDBPromise=null, attachmentFallback=false;
function attachmentDB(){
 if(attachmentDBPromise)return attachmentDBPromise;
 attachmentDBPromise=new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}
  const req=indexedDB.open('EMISEM_DEMO_ATTACHMENTS_V3',1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('documents'))req.result.createObjectStore('documents',{keyPath:'key'});};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('IndexedDB error'));
 });return attachmentDBPromise;
}
async function saveAttachmentBlob(key,file){
 try{const db=await attachmentDB();await new Promise((resolve,reject)=>{const tx=db.transaction('documents','readwrite');tx.objectStore('documents').put({key,blob:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});return true;}
 catch(e){attachmentFallback=true;volatileFiles.set(key,file);return false;}
}
async function readAttachmentBlob(key){
 if(volatileFiles.has(key))return volatileFiles.get(key);
 try{const db=await attachmentDB();return await new Promise((resolve,reject)=>{const req=db.transaction('documents','readonly').objectStore('documents').get(key);req.onsuccess=()=>resolve(req.result?.blob||null);req.onerror=()=>reject(req.error);});}catch(e){return null;}
}
async function removeAttachmentBlob(key){volatileFiles.delete(key);try{const db=await attachmentDB();await new Promise((resolve,reject)=>{const tx=db.transaction('documents','readwrite');tx.objectStore('documents').delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}catch(e){}}
async function addAppAttachments(a,items){
 if(!a.attachments)a.attachments=[];
 for(const {file,kind} of items){
  if(kind!=='specialized_certificate'){
   for(const old of a.attachments.filter(x=>x.kind===kind))await removeAttachmentBlob(a.id+':'+old.id);
   a.attachments=a.attachments.filter(x=>x.kind!==kind);
  }
  const id='DOC-'+String(Date.now())+'-'+Math.random().toString(36).slice(2,7);
  const durable=await saveAttachmentBlob(a.id+':'+id,file);
  a.attachments.push({id,kind,name:file.name,mime:file.type,size:file.size,storage:durable?'indexeddb':'session',uploadedAt:new Date().toLocaleString('sv-SE')});
 }

 if(!a)return -1;

 return i;
}

function t3RoomCapacity(room,use='lecture'){if(room.roomType==='lab'&&use==='lab')return Math.min(Number(room.capacity||0),Number(room.devices||0));return Number(room.capacity||0)}
function t3OverlapWeeks(a,b){return Math.max(Number(a.weeksFrom||1),Number(b.weeksFrom||1))<=Math.min(Number(a.weeksTo||14),Number(b.weeksTo||14))}
function t3RoomChoices(s){const t=t3Init();const wanted=Math.ceil(Number(s.students||0)*(1+t.settings.buffer/100));return data.rooms.map(r=>{const reasons=[];if(r.status!=='active'||!r.active)reasons.push('مغلق أو تحت الصيانة');if(!(r.uses||[]).includes(s.kind))reasons.push('نوع الاستخدام');if(t3RoomCapacity(r,s.kind)<wanted)reasons.push('السعة المطلوبة '+wanted);if(r.owner&&r.owner!=='DEP-IS'&&r.owner!=='shared')reasons.push('مخصص لقسم آخر');(s.requirements||[]).forEach(k=>{if(!(r.equipment||[]).includes(k))reasons.push('متطلب إلزامي: '+t3Label(t.tools,k))});
 if(t.sessions.some(x=>x.id!==s.id&&x.room===r.id&&x.day===s.day&&timeConflict(x,s)&&t3OverlapWeeks(x,s)&&x.status==='allocated'))reasons.push('تعارض حجز');

 for(let d=0;d<=max;d++){let day=new Date(base);day.setDate(day.getDate()+d);const date=day.toISOString().slice(0,10),name=names[day.getDay()];for(const start of [s.start,...slots.filter(x=>x!==s.start)]){const st=Number(start.slice(0,2))*60+Number(start.slice(3)),et=st+dur;if(et>23*60)continue;const end=String(Math.floor(et/60)).padStart(2,'0')+':'+String(et%60).padStart(2,'0');const candidate={...s,day:name,start,end};const busy=t.sessions.some(x=>x.id!==s.id&&x.day===name&&timeConflict(x,candidate)&&(x.instructor===s.instructor||x.audience===s.audience)&&x.status==='allocated');if(busy)continue;const rm=t3RoomChoices(candidate).find(x=>x.valid);if(!rm)continue;result.push({date,day:name,start,end,room:rm.room.id,roomName:rm.room.name,score:rm.score,offset:d,originalTime:start===s.start});if(result.length>=28)break;}if(result.length>=28)break;}

function t3Action(act,id=''){
 const t=t3Init();
 if(act==='t3-plan-form'){if(t3WriteOK())t3ModalPlan();return;}
 if(act==='t3-term-form'){if(t3WriteOK())t3ModalTermForm();return;}

 if(act==='t3-building-form'){if(!t3WriteOK())return;showModal('إضافة مبنى',`<form data-form="t3-building" class="form-grid">${field('name','اسم المبنى')}<div class="field full"><button class="btn primary" type="submit">إضافة</button></div></form>`);return;}
 if(act==='t3-plan-remove'){if(!t3WriteOK())return;const p=t.plans.find(x=>x.id===id);if(t.termCourses.some(tc=>tc.course===p?.course))return toast('لا يمكن حذف مادة من الخطة وهي مستخدمة في الترم.',true);if(!confirm('حذف المادة من الخطة التجريبية؟'))return;t.plans=t.plans.filter(x=>x.id!==id);t3Audit('حذف مقرر من الخطة: '+id);render();return;}
 if(act==='t3-add-plan-course'){if(!t3WriteOK())return;const p=t.plans.find(x=>x.id===id);if(!p)return;const c=courseBy(p.course),aud=t.audiences[0];const tc={id:nextId('TC',t.termCourses),course:p.course,program:p.program,audience:aud.id,students:aud.students,mode:'inperson',weeks:'1-12',status:'draft',lastSent:''};t.termCourses.push(tc);const off={id:nextId('OFF',data.offerings),course:tc.course,instructor:t.teachers[0].name,term:data.settings.term,capacity:tc.students,day:'السبت',start:'16:00',end:'18:00',room:'',status:'pending'};data.offerings.push(off);tc.offeringId=off.id;const ss={id:nextId('SS',t.sessions),termCourse:tc.id,offering:off.id,kind:'lecture',group:'L1',students:tc.students,instructor:off.instructor,day:off.day,start:off.start,end:off.end,weeksFrom:1,weeksTo:12,room:'',mode:'inperson',requirements:['projector'],optional:['wifi'],status:'pending',audience:aud.id};t.sessions.push(ss);t3Audit('إضافة مقرر من الخطة للترم: '+c.code);render();return;}
 if(act==='t3-send'){if(!t3WriteOK())return;const tc=t3TC(id);if(!tc)return;const ss=t.sessions.filter(x=>x.termCourse===id&&x.mode!=='online');if(!ss.length)return toast('لا توجد حصص حضورية للتوزيع.',true);let count=0;ss.forEach(s=>{if(t.requests.some(r=>r.session===s.id&&r.kind==='allocate'&&r.status==='pending'))return;t.requests.push({id:nextId('RQ',t.requests),kind:'allocate',session:s.id,date:'',reason:'طلب توزيع من Course Management',status:'pending',origin:'Course Management',created:today});count++;});tc.status='sent';tc.lastSent=today;t3Audit('إرسال '+(courseBy(tc.course)?.code||'')+' للقاعات · '+count+' طلب جديد');ui.modal='';route('t3-sync');toast('تم إرسال طلبات التوزيع للمراجعة البشرية.');return;}
 if(act==='t3-room-toggle'){if(!t3WriteOK())return;const r=roomBy(id);if(!r)return;r.status=r.status==='active'?'maintenance':'active';r.active=r.status==='active';const affected=t.sessions.filter(s=>s.room===id&&s.status==='allocated');if(r.status!=='active')affected.forEach(s=>t.alerts.push({id:nextId('AL',t.alerts),message:'حصة '+t3Name(s)+' متأثرة بصيانة '+r.name,status:'review'}));t3Audit('تغيير حالة '+r.name+' إلى '+r.status+'؛ تأثر '+affected.length+' حصص');render();return;}
 return toast('إجراء Team 3 غير معروف: '+act,true);
}
function t3Submit(kind,form){const t=t3Init(),v=Object.fromEntries(new FormData(form).entries()),n=k=>Number(v[k]),fail=msg=>toast(msg,true);if(!t3WriteOK())return;
 if(kind==='t3-settings'){if(!['buffer','maxLecture','maxSection','maxLab','termWeeks','moveWindow'].every(k=>Number.isFinite(n(k))&&n(k)>=0)||n('buffer')>60||n('termWeeks')<1||n('termWeeks')>52||[n('maxLecture'),n('maxSection'),n('maxLab')].some(x=>x<1))return fail('راجع حدود الإعدادات.');t.settings={buffer:n('buffer'),maxLecture:n('maxLecture'),maxSection:n('maxSection'),maxLab:n('maxLab'),termWeeks:n('termWeeks'),moveWindow:n('moveWindow'),slots:(v.slots||'').trim()};t3Audit('تعديل حدود مجموعات التدريس والسعة');ui.modal='';render();return toast('تم حفظ إعدادات Team 3.');}
 if(kind==='t3-building'){if(!v.name?.trim())return fail('اسم المبنى مطلوب.');if(t.buildings.some(x=>x.name===v.name.trim()))return fail('المبنى مسجل.');t.buildings.push({id:nextId('B',t.buildings),name:v.name.trim(),active:true});t3Audit('إضافة مبنى '+v.name);ui.modal='';render();return;}
 if(kind==='t3-room'){if(!v.name?.trim()||n('capacity')<1||n('devices')<0)return fail('راجع اسم المكان والسعة والأجهزة.');if(data.rooms.some(x=>x.name===v.name.trim()))return fail('المكان موجود مسبقًا.');let eq=v.equipment.split(',').map(x=>x.trim()).filter(Boolean),uses=v.uses.split(',').map(x=>x.trim()).filter(Boolean);if(!uses.length)return fail('حدد نوع استخدام واحد على الأقل.');data.rooms.push({id:nextId('RM',data.rooms),name:v.name.trim(),capacity:n('capacity'),devices:n('devices'),floor:v.floor,building:v.building,roomType:v.roomType,type:v.roomType==='lab'?'Lab':'Physical',facilities:eq.join(', '),equipment:eq,uses,active:true,status:'active',owner:'DEP-IS',minCapacity:1});t3Audit('إضافة مكان '+v.name);ui.modal='';render();return;}
 if(kind==='t3-plan'){const c=courseBy(v.course),level=n('level');if(!c)return fail('المقرر غير معروف.');if(t.plans.some(p=>p.program===t.selectedProgram&&p.course===v.course&&p.level===level&&p.term===v.term))return fail('مكرر في الخطة.');if(c.prereq){const prereq=t.plans.find(p=>p.program===t.selectedProgram&&courseBy(p.course)?.code===c.prereq);if(!prereq||prereq.level>=level)return fail('متطلب سابق غير موجود في مستوى أسبق: '+c.prereq);}t.plans.push({id:nextId('PL',t.plans),program:t.selectedProgram,name:'لائحة الماجستير التنفيذي (تجريبية)',course:v.course,term:v.term,level,required:v.required==='yes',prereq:c.prereq||''});t3Audit('إضافة '+c.code+' للخطة');ui.modal='';render();return;}
 if(kind==='t3-term'){const c=courseBy(v.course),a=t.audiences.find(x=>x.id===v.audience),students=n('students'),from=n('fromWeek'),to=n('toWeek');if(!c||!a||students<1||students>2000||v.start>=v.end||from<1||to>t.settings.termWeeks||from>to)return fail('راجع البيانات وعدد الطلاب وفترة الدراسة.');const courseId=nextId('TC',t.termCourses),tc={id:courseId,course:c.id,program:a.program,audience:a.id,students,mode:v.mode,weeks:from+'-'+to,status:'draft',lastSent:''};t.termCourses.push(tc);const count=Math.ceil(students/t.settings.maxLecture),groupSize=Math.ceil(students/count);let number=1;const ss=[];
 for(let i=1;i<=count;i++){const size=Math.min(groupSize,students-(i-1)*groupSize),l='L'+i;ss.push({id:'SS-'+String(Date.now()+number++),termCourse:tc.id,offering:'',kind:'lecture',group:l,parentGroup:'',students:size,instructor:v.instructor,day:v.day,start:v.start,end:v.end,weeksFrom:from,weeksTo:to,room:'',mode:v.mode,requirements:v.mode==='online'?[]:['projector'],optional:['wifi'],status:v.mode==='online'?'online':'pending',audience:a.id});for(const [kind,max,key] of [['section',t.settings.maxSection,'S'],['lab',t.settings.maxLab,'M']]){if(v[kind==='section'?'sections':'labs']!=='yes')continue;const chunks=Math.ceil(size/max),chunkSize=Math.ceil(size/chunks);for(let j=1;j<=chunks;j++)ss.push({id:'SS-'+String(Date.now()+number++),termCourse:tc.id,offering:'',kind,group:l+'-'+key+j,parentGroup:l,students:Math.min(chunkSize,size-(j-1)*chunkSize),instructor:kind==='lecture'?v.instructor:'م. سلمى عادل',day:v.day,start:kind==='lab'?'18:00':'14:30',end:kind==='lab'?'20:00':'16:00',weeksFrom:from,weeksTo:to,room:'',mode:'inperson',requirements:kind==='lab'?['computers']:[],optional:['projector'],status:'pending',audience:a.id});}}
 const of={id:nextId('OFF',data.offerings),course:c.id,instructor:v.instructor,term:data.settings.term,capacity:students,day:v.day,start:v.start,end:v.end,room:'',status:'pending'};data.offerings.push(of);tc.offeringId=of.id;ss.forEach(s=>{s.offering=of.id;t.sessions.push(s)});t3Audit('إضافة '+c.code+' للترم وتوليد '+ss.length+' حصص');ui.modal='';render();return toast('تم تكوين '+count+' مجموعات محاضرة و'+(ss.length-count)+' سكاشن/معامل.');}
 if(kind==='t3-request'){const s=t3SS(v.session);if(!s)return fail('اختر حصة صالحة.');if(!v.reason?.trim())return fail('السبب مطلوب.');if(v.kind!=='allocate'&&!v.date)return fail('حدد تاريخ الاستثناء.');t.requests.push({id:nextId('RQ',t.requests),kind:v.kind,session:s.id,date:v.kind==='allocate'?'':v.date,reason:v.reason.trim(),status:'pending',origin:'إدارة / عضو هيئة التدريس',created:today});t3Audit('إنشاء طلب '+t3ReqKinds[v.kind]+' للحصة '+s.id);ui.modal='';route('t3-requests');return toast('تم إرسال الطلب لموظف التوزيع.');}
 if(kind==='t3-unavailable'){const r=t.requests.find(x=>x.id===v.request);if(!r||r.status!=='pending')return fail('الطلب ليس معلقًا.');if(!v.reason?.trim())return fail('يجب تسجيل السبب عند تعذّر التوزيع.');r.status='unavailable';r.failureReason=v.reason.trim();const s=t3SS(r.session),tc=t3TC(s?.termCourse);if(tc&&r.kind==='allocate')tc.status='changed';t3Audit('تعذر توزيع '+r.id+'؛ السبب '+r.failureReason);ui.modal='';route('t3-requests');return;}
 if(kind==='t3-allocate'){const r=t.requests.find(x=>x.id===v.request),s=t3SS(r?.session);if(!r||r.status!=='pending'||!s)return fail('الطلب غير صالح.');if(['cancel','online'].includes(r.kind)){t.overrides.push({id:nextId('OV',t.overrides),session:s.id,kind:r.kind,date:r.date||today,room:'',reason:r.reason});r.status='allocated';r.approvedOn=today;t3Audit('اعتماد استثناء '+r.id+' · '+t3ReqKinds[r.kind]);ui.modal='';route('t3-requests');return toast('تم تأكيد الإجراء دون تغيير الجدول الأسبوعي.');}
 let roomId=v.room,override={id:nextId('OV',t.overrides),session:s.id,kind:r.kind,date:r.date||today,reason:r.reason};if(r.kind==='move'){const options=t3MoveOptions(s,r),pick=options.find(x=>[x.date,x.day,x.start,x.end,x.room].join('|')===v.newSchedule);if(!pick)return fail('موعد بديل غير صالح.');roomId=pick.room;Object.assign(override,{date:pick.date,day:pick.day,start:pick.start,end:pick.end,room:roomId});}else{const choice=t3RoomChoices(s).find(x=>x.room.id===roomId);if(!choice?.valid)return fail('القاعة غير مطابقة، لا يمكن الاعتماد.');override.room=roomId;}
 if(['move','manual','exceptional'].includes(r.kind))t.overrides.push(override);else{s.room=roomId;s.status='allocated';const o=offeringBy(s.offering);if(o&&s.kind==='lecture'){o.room=roomId;o.status='scheduled';}}r.status='allocated';r.allocatedRoom=roomId;r.approvedOn=today;t3Audit('اعتماد '+r.id+' للمكان '+(roomBy(roomId)?.name||'—'));ui.modal='';route('t3-requests');return toast('تم تسجيل قرار التوزيع.');}
}

async function downloadAppAttachment(ref,preview){
 const [appId,docId]=ref.split('|'),a=appBy(appId),doc=a?.attachments?.find(x=>x.id===docId);
 if(!isOwnApp(appId)||!doc)return toast('هذا المستند غير متاح لهذا الحساب.',true);
 let tab=null;if(preview)tab=window.open('about:blank','_blank');
 const blob=await readAttachmentBlob(appId+':'+docId);
 if(!blob){if(tab)tab.close();return toast('ملف المستند غير متاح في هذا المتصفح. أعد رفع ملف الديمو.',true);}
 const url=URL.createObjectURL(blob);
 if(preview){if(tab){tab.location.href=url;}else toast('المتصفح منع فتح نافذة المعاينة.',true);}else{const link=document.createElement('a');link.href=url;link.download=doc.name;document.body.append(link);link.click();link.remove();}
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function deleteAppAttachment(ref){
 const [appId,docId]=ref.split('|'),a=appBy(appId),doc=a?.attachments?.find(x=>x.id===docId);
 if(!a||!isOwnApp(appId)||!doc||!['draft','submitted'].includes(a.status)||!requirePerm('appEdit'))return;
 if(!confirm('هل تريد حذف '+doc.name+'؟'))return;
 await removeAttachmentBlob(appId+':'+docId);a.attachments=a.attachments.filter(x=>x.id!==docId);a.certs=a.attachments.filter(x=>x.kind==='specialized_certificate').length;a.docs='pending';log('حذف مرفق '+doc.name+' من '+appId,'Admission');documentManager(appId);toast('تم حذف المستند.');
}
function action(act,id=''){
 if(act.startsWith('t3-'))return t3Action(act,id);
  switch(act){
  case 'selfEnroll':{
  if(ui.role!=='applicant'||!can('selfEnroll'))return toast('التسجيل متاح للطالب فقط.',true);
  const student=ownStudent(),o=offeringBy(id);if(!student||!o||student.status!=='active')return toast('يجب إتمام القبول والقيد الجامعي أولًا.',true);
  if(paymentOrderFor(student.id))return toast('تم إصدار إذن سداد لهذا الفصل؛ التعديل يحتاج إجراءً رسميًا.',true);
  if(o.status==='pending')return toast('الشعبة غير منشورة بعد.',true);
  if(data.enrollments.some(e=>e.student===student.id&&e.offering===id&&enrollmentStatus(e)!=='rejected'))return toast('أنت مسجل في الشعبة بالفعل.',true);
  if(data.enrollments.filter(e=>e.offering===id&&enrollmentStatus(e)!=='rejected').length>=o.capacity)return toast('اكتملت سعة الشعبة.',true);
  if(data.enrollments.some(e=>{const other=offeringBy(e.offering);return e.student===student.id&&enrollmentStatus(e)!=='rejected'&&other?.day===o.day&&timeConflict(other,o)}))return toast('هناك تعارض مع محاضرة مسجلة.',true);
  const pre=courseBy(o.course)?.prereq;if(pre&&!data.marks.some(m=>m.student===student.id&&m.status==='published'&&courseBy(offeringBy(m.offering)?.course)?.code===pre&&grade(m).total>=60))return toast('هذا المقرر يحتاج استيفاء المتطلب السابق '+pre,true);
  const en={id:nextId('ENR',data.enrollments),student:student.id,offering:id,date:today,status:'pending_review',requestedBy:'applicant'};
  data.enrollments.push(en);log('طلب تسجيل مقرر '+id+' بواسطة الطالب '+student.id,'Enrollment');route('my-enrollment');toast('تم إرسال تسجيل المقرر لشئون الطلاب للمراجعة.');break;
 }
 case 'reviewEnroll':{
  if(!requirePerm('enrollReview'))return;const e=data.enrollments.find(x=>x.id===id);if(!e||enrollmentStatus(e)!=='pending_review')return toast('هذا التسجيل لا ينتظر المراجعة.',true);
  if(paymentOrderFor(e.student))return toast('سبق إصدار إذن سداد للفصل، لا يمكن اعتماد تسجيلات جديدة دون تحديث.',true);
  e.status='confirmed';e.reviewedBy=roles[ui.role];e.reviewedOn=today;log('شئون الطلاب اعتمدت تسجيل '+e.id,'Enrollment');render();toast('تم اعتماد تسجيل المقرر.');break;
 }

 case 'marks':if(!requirePerm('marks'))return;if(!studentBy(v.student)||!offeringBy(v.offering))return fail('Invalid student/offering.');if(!data.enrollments.some(e=>e.student===v.student&&e.offering===v.offering))return fail('الطالب غير مسجل في هذا المقرر.');if(n('coursework')<0||n('coursework')>40||n('exam')<0||n('exam')>60||!Number.isFinite(n('exam')))return fail('أعمال السنة من 0 إلى 40 والامتحان من 0 إلى 60.');let mark=data.marks.find(m=>m.student===v.student&&m.offering===v.offering);if(mark&&mark.status==='published')return fail('لا يمكن تعديل نتيجة منشورة مباشرة؛ يلزم إجراء تصحيح معتمد.');if(mark&&mark.status==='approved')return fail('نتيجة معتمدة؛ يلزم فتح تصحيح معتمد قبل التعديل.');if(!mark){mark={id:nextId('M',data.marks),student:v.student,offering:v.offering,status:'draft'};data.marks.push(mark);}mark.coursework=n('coursework');mark.exam=n('exam');done('تم حفظ درجات '+mark.id+' كمسودة','Results');break;
 case 'user':if(!requirePerm('admin'))return;if(!v.name?.trim()||!roles[v.role])return fail('اختر اسم المستخدم والدور.');data.users.push({id:nextId('USR',data.users),name:v.name.trim(),role:v.role,status:'active'});done('تمت إضافة مستخدم تجريبي','Administration');break;
 case 'settings':if(!requirePerm('admin'))return;if(!v.intake?.trim()||!v.term?.trim())return fail('حدد دورة القبول والفصل الأكاديمي.');data.settings={intake:v.intake.trim(),term:v.term.trim(),admissionStatus:v.admissionStatus,notifications:v.notifications==='yes'};done('تم تحديث إعدادات العرض','Administration');break;
 case 'policy':if(!requirePerm('policyDraft'))return;if(!data.draftPolicy)return fail('أنشئ نسخة Draft أولًا قبل تعديل سياسة نشطة.');if(data.draftPolicy.status==='pending')return fail('المسودة بانتظار الاعتماد ولا يمكن تعديلها الآن.');const weights={gpa:n('gpa'),experience:n('experience'),leadership:n('leadership'),certs:n('certs'),interview:n('interview'),careerProfile:n('careerProfile')};if(Object.values(weights).some(w=>!Number.isInteger(w)||w<0||w>100))return fail('كل وزن يجب أن يكون عددًا صحيحًا من 0 إلى 100.');let sum=Object.values(weights).reduce((a,b)=>a+b,0);if(sum!==100)return fail('مجموع الأوزان = '+sum+'%. يجب أن يساوي 100%.');if(n('threshold')<0||n('threshold')>100||n('minGpa')<0||n('minGpa')>4)return fail('حد التوصية يجب أن يكون 0–100 والـGPA بين 0–4.');Object.assign(data.draftPolicy,{weights,threshold:n('threshold'),minGpa:n('minGpa'),status:'draft'});log('حفظ مسودة AI Policy v'+data.draftPolicy.version,'AI Configuration');render();toast('تم حفظ الأوزان الجديدة. اضغط Request Approval عند الجاهزية.');break;
 }
}

document.addEventListener('submit',ev=>{const f=ev.target;if(f.matches('[data-form]')){ev.preventDefault();submitForm(f.dataset.form,f);}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='rolePick'){ui.role=t.value;ui.modal='';ui.page=roleHome();render();toast('الدور الحالي: '+roles[ui.role]);}if(t.id==='envPick'){ui.env=t.value;render();toast('تغيير علامة البيئة للعرض فقط، لا يُنشئ Database منفصلة.');}if(t.id==='aiSelect'){ui.aiApp=t.value;render();}if(t.id==='studentSelect'){ui.student=t.value;render();}if(t.id==='statusFilter'){ui.filter=t.value;render();}if(t.id==='t3BuildingFilter'){t3Init().selectedBuilding=t.value;render();}if(t.id==='t3WeekFilter'){t3Init().currentWeek=Number(t.value);render();}if(t.id==='t3ReqFilter'){t3Init().selectedRequests=t.value;render();}if(t.id==='t3ProgramFilter'){t3Init().selectedProgram=t.value;render();}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='listSearch'){ui.search=t.value;const q=t.value.toLowerCase();$$('tbody tr').forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'})}if(t.id==='commandSearch'){const q=t.value.trim().toLowerCase();$$('.command-item').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(q)?'flex':'none');}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal){ui.modal='';render()}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();action('search')}});
render();
